name: Test and Build Application CI

# Проверять linting, тесты, сборку image и Docker Compose stack при изменениях в main и в pull request перед merge.
# После merge в main публиковать Docker image в GitHub Container Registry.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD: ci_admin_password

    steps:
      # 1. Скачать код репозитория на runner GitHub Actions
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Использовать ту же основную версию Python, что и в Dockerfile
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Установить зависимости приложения, тестов и линтера
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # 4. Проверить Python-код линтером Ruff
      - name: Run Ruff linting
        run: ruff check .

      # 5. Проверить endpoints приложения автоматическими тестами
      - name: Run application tests
        run: python -m pytest -v

      # 6. Проверить, что Docker image приложения успешно собирается
      - name: Build Docker image
        run: docker build --file Dockerfile --tag devops-junior-project:test .

      # 7. Проверить конфигурацию Docker Compose
      - name: Validate Docker Compose config
        run: docker compose config >/dev/null

      # 8. Запустить весь Docker Compose stack и дождаться healthy-состояния сервисов
      - name: Run Docker Compose stack healthcheck
        run: |
          docker compose up -d --build
          docker compose ps

          for service in web-app prometheus grafana; do
            container_id="$(docker compose ps -q "$service")"

            if [ -z "$container_id" ]; then
              echo "Container for service $service was not found"
              docker compose ps
              exit 1
            fi

            echo "Waiting for $service to become healthy..."

            for i in {1..30}; do
              status="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
              echo "$service health status: $status"

              if [ "$status" = "healthy" ]; then
                break
              fi

              sleep 5
            done

            if [ "$status" != "healthy" ]; then
              echo "$service did not become healthy"
              docker compose ps
              docker compose logs "$service"
              exit 1
            fi
          done

          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:9090/-/healthy
          curl -fsS http://localhost:3000/api/health

      # 9. Остановить stack после проверки даже при ошибке
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v

      # 10. Войти в GitHub Container Registry только после merge/push в main
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # 11. Собрать image с тегами для GitHub Container Registry
      - name: Build GHCR image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --file Dockerfile \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            .

      # 12. Опубликовать image в GitHub Container Registry
      - name: Push GHCR image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"

      # 13. Вывести сообщение после успешного прохождения всех шагов
      - name: Success message
        run: echo "Linting, tests, Docker image build, Docker Compose stack check and optional GHCR publish completed successfully!"